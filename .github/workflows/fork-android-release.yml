name: Build & Release Fork APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (empty for auto: v<version>-p2p-fix)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title (empty for auto)'
        required: false
        type: string
        default: ''
      side_by_side:
        description: 'Install alongside original app'
        required: true
        type: boolean
        default: true
      build_type:
        description: 'Build Type (release/debug)'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Save as Draft Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Resolve Version and Tag
        id: meta
        env:
          SIDE_BY_SIDE: ${{ inputs.side_by_side }}
          USER_TAG: ${{ inputs.tag_name }}
          USER_TITLE: ${{ inputs.release_title }}
        run: |
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -n 1)"
          if [[ -z "${version}" ]]; then
            version="0.6.2"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if [[ -n "${USER_TAG}" ]]; then
            tag="${USER_TAG}"
          elif [[ "${SIDE_BY_SIDE}" == "true" ]]; then
            tag="v${version}-p2p-fix-dev"
          else
            tag="v${version}-p2p-fix"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if [[ -n "${USER_TITLE}" ]]; then
            title="${USER_TITLE}"
          else
            title="Nuvio Mobile v${version} (P2P External Player Fix)"
          fi
          echo "title=${title}" >> "${GITHUB_OUTPUT}"

      - name: Configure App Identity (Side-by-Side Coexist)
        id: identity
        env:
          SIDE_BY_SIDE: ${{ inputs.side_by_side }}
        run: |
          # Ensure display label is always "Nuvio" across build types
          mkdir -p androidApp/src/main/res/values
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="app_name">Nuvio</string>' \
            '</resources>' > androidApp/src/main/res/values/strings.xml

          mkdir -p androidApp/src/debug/res/values
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="app_name">Nuvio</string>' \
            '</resources>' > androidApp/src/debug/res/values/strings.xml

          if [[ "${SIDE_BY_SIDE}" == "true" ]]; then
            echo "Enabling side-by-side mode (com.nuvio.app.dev)..."
            echo "gradle_suffix=-Pnuvio.android.applicationIdSuffix=.dev" >> "${GITHUB_OUTPUT}"
          else
            echo "Using default package ID (com.nuvio.app)..."
            echo "gradle_suffix=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure Keystore & Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          # 1. Prepare local.properties
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

          # 2. Setup signing keystore for release builds
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
            if [[ -n "${KEYSTORE_BASE64}" ]]; then
              printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
            else
              echo "Generating standalone signing keystore for fork release..."
              keytool -genkey -v \
                -keystore "${keystore_path}" \
                -alias nuvio \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass nuviopassword \
                -keypass nuviopassword \
                -dname "CN=NuvioFork, OU=Mobile, O=Nuvio, L=Unknown, S=Unknown, C=US"

              printf '\nNUVIO_RELEASE_STORE_PASSWORD=nuviopassword\n' >> local.properties
              printf 'NUVIO_RELEASE_KEY_ALIAS=nuvio\n' >> local.properties
              printf 'NUVIO_RELEASE_KEY_PASSWORD=nuviopassword\n' >> local.properties
            fi
            printf 'NUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties
          fi

      - name: Build Android APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          GRADLE_SUFFIX: ${{ steps.identity.outputs.gradle_suffix }}
        run: |
          task=":androidApp:assembleFullDebug"
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            task=":androidApp:assembleFullRelease"
          fi

          ./gradlew "${task}" \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pnuvio.app.versionName="${VERSION_NAME}" \
            ${GRADLE_SUFFIX} \
            "-Dorg.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC" \
            "-Dkotlin.daemon.jvm.options=-Xmx2048M" \
            --max-workers=2 \
            --stacktrace

      - name: Collect APK Files
        id: collect
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/full -name "*.apk" -type f -exec cp {} dist/ \;
          echo "Generated APKs:"
          ls -lh dist/

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > release-notes.md
          ## Nuvio Mobile - Fork Build

          ### Changes in this build:
          EOF

          # List commits unique to this branch compared to cmp-rewrite (or last 5 commits fallback)
          if git rev-parse --verify --quiet origin/cmp-rewrite >/dev/null 2>&1; then
            git log origin/cmp-rewrite..HEAD --pretty=format:"* %s (%h)" >> release-notes.md || true
          else
            git log -n 5 --pretty=format:"* %s (%h)" >> release-notes.md
          fi
          echo "" >> release-notes.md
          cat release-notes.md

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-fork-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # If release already exists, upload assets to it
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading assets to it..."
            gh release upload "${TAG}" dist/*.apk --clobber
          else
            extra_args=()
            if [[ "${PRERELEASE}" == "true" ]]; then
              extra_args+=(--prerelease)
            fi
            if [[ "${DRAFT}" == "true" ]]; then
              extra_args+=(--draft)
            fi

            gh release create "${TAG}" dist/*.apk \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              "${extra_args[@]}"
          fi

